<style id="app-css">
/* Layout: header + legend/toolbar, swimlane diagrams per flow with notes; editor drawer on the right (bottom sheet on phones) */
:root{
  --bg:#f5f7f8; --panel:#ffffff; --fg:#17232b; --muted:#56656f; --line:#3b4a54; --rule:#d9e0e4; --field:#f8fafb;
  --sap:#1f5f9e; --sap-t:#e7f0f9; --loc:#0f7a6c; --loc-t:#e3f4f1; --pos:#a2620f; --pos-t:#fbf0e0;

  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11181d; --panel:#172128; --fg:#e4ecf0; --muted:#97a7b1; --line:#a9b8c1; --rule:#2a3740; --field:#121b21;
  --sap:#6ea8e6; --sap-t:#16283a; --loc:#4cc2b0; --loc-t:#112c29; --pos:#e3a54e; --pos-t:#2e2414;
  --b1:#a98ee6; --b1-t:#241d36; --exc:#ef7d72; --exc-t:#341a18; --lane-a:#151f25; --lane-b:#18232a;
  --sel:#8cc0f5; --warn-t:#33290f; --warn:#f0cf7a; color-scheme:dark}}
:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;padding:0 20px}
#app{max-width:1500px;margin:0 auto;padding-block:28px 48px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-size:clamp(24px,3.2vw,34px);line-height:1.15;margin:6px 0 8px;text-wrap:balance;font-weight:700}
.lede{color:var(--muted);max-width:70ch;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin:22px 0 10px;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:22px;height:14px;border:1.5px solid var(--line);border-radius:3px;background:var(--panel)}
.sw.d{transform:rotate(45deg);width:12px;height:12px;border-radius:1px}
.sw.o{border-radius:999px}.sw.x{border-color:var(--exc);background:var(--exc-t)}.sw.p{border-style:dashed}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;gap:4px}

button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.primary{background:var(--sel);color:var(--bg);border-color:var(--sel)}
button.danger{color:var(--exc);border-color:var(--exc)}
button.sm{padding:3px 9px;font-size:12px}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--warn-t);color:var(--warn);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14px}
section{margin-top:30px}
.sh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:10px}
.sh h2{margin:0;font-size:21px}
.sh .route{font-family:var(--mono);font-size:13px;color:var(--muted)}
.scroller{overflow-x:auto;background:var(--panel);border:1px solid var(--rule);border-radius:10px}
.scroller svg{display:block;touch-action:pan-x pan-y}
.fit .scroller svg{width:100%;height:auto}
.editing .node{cursor:grab}
.editing .node:active{cursor:grabbing}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 28px;margin-top:14px;font-size:14px;color:var(--muted)}
.notes p{margin:0;min-width:0}.notes b{color:var(--fg);font-weight:600}
footer{margin-top:36px;font-size:13px;color:var(--muted)}
svg text{font-family:var(--sans)}
.lane-name{font-weight:700;font-size:13px;fill:var(--fg)}.lane-role{font-size:11px;fill:var(--muted)}
.n-t{font-weight:600;font-size:12.5px;fill:var(--fg)}.n-s{font-size:11px;fill:var(--muted)}
.edge{fill:none;stroke:var(--line);stroke-width:1.5}.edge.p{stroke-dasharray:5 4}.edge.x{stroke:var(--exc)}
.elbl{font-family:var(--mono);font-size:11px;fill:var(--fg);paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
.tag{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.selbox{fill:none;stroke:var(--sel);stroke-width:2;stroke-dasharray:4 3}
/* editor */
#panel{position:fixed;top:0;right:0;bottom:0;width:370px;background:var(--panel);border-left:1px solid var(--rule);overflow-y:auto;padding:16px 18px calc(28px + env(safe-area-inset-bottom,0px));z-index:10;font-size:14px}
@media (min-width:1000px){#app.editing{padding-right:384px}}
@media (max-width:999px){#panel{top:auto;left:0;width:auto;height:56vh;border-left:0;border-top:1px solid var(--rule);box-shadow:0 -6px 20px rgba(0,0,0,.12)}#app.editing{padding-bottom:58vh}}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.ph h3{margin:0;font-size:16px}
.status{font-size:12px;color:var(--muted);margin:0 0 10px}
.status.dirty{color:var(--warn)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px}
.grp{border-top:1px solid var(--rule);padding-top:12px;margin-top:14px}
.grp h4{margin:0 0 8px;font-size:12px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.pf{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;min-width:0}
.pf label,.lbl{font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=text],input[type=number],select,textarea{font:14px var(--sans);color:var(--fg);background:var(--field);border:1px solid var(--rule);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
textarea{resize:vertical}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;margin:2px 0}
.card{border:1px solid var(--rule);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--field)}
.card input,.card select{background:var(--panel)}
.inlist{font-size:13px;color:var(--muted);margin:0 0 8px}
</style>

": 1, "row": 0, "title": "Count stock in LOC SMS", "sub": "Physical count or cycle count by store", "tag": ""}, {"id": "da", "lane": "loc", "col": 2, "row": 0, "title": "Count\napproved?", "sub": "", "tag": "", "shape": "dia"}, {"id": "dr", "lane": "loc", "col": 2, "row": 1, "title": "Review and recount", "sub": "Supervisor checks large variances", "tag": "", "exc": true}, {"id": "d2", "lane": "loc", "col": 3, "row": 0, "title": "Send variances and adjustments", "sub": "Item, store, counted vs book qty, count ID", "tag": ""}, {"id": "d3", "lane": "b1", "col": 3, "row": 0, "title": "Validate and map", "sub": "Duplicate check on count ID", "tag": ""}, {"id": "dv", "lane": "sap", "col": 4, "row": 0, "title": "Valid in\nSAP?", "sub": "", "tag": "", "shape": "dia"}, {"id": "dx", "lane": "sap", "col": 4, "row": 1, "title": "Reject with reason", "sub": "Returned to LOC for correction", "tag": "", "exc": true}, {"id": "d4", "lane": "sap", "col": 5, "row": 0, "title": "Post inventory adjustment", "sub": "Counted qty becomes the book qty", "tag": ""}, {"id": "d5", "lane": "sap", "col": 6, "row": 0, "title": "On-hand balance updated", "sub": "SAP B1 remains the authority", "tag": ""}, {"id": "d6", "lane": "loc", "col": 6, "row": 0, "title": "Receive updated balance", "sub": "Through the Flow C sync", "tag": ""}, {"id": "e", "lane": "loc", "col": 7, "row": 0, "title": "Count closed", "sub": "", "tag": "", "shape": "oval"}], "edges": [{"id": "w1", "from": "s", "to": "d1", "fs": "r", "ts": "l"}, {"id": "w2", "from": "d1", "to": "da", "fs": "r", "ts": "l"}, {"id": "w3", "from": "da", "to": "d2", "fs": "r", "ts": "l", "label": "Yes"}, {"id": "w4", "from": "da", "to": "dr", "fs": "b", "ts": "t", "label": "No", "exc": true}, {"id": "w5", "from": "dr", "to": "d1", "fs": "l", "ts": "b", "via": [["b", "a"]], "label": "Recount", "exc": true}, {"id": "w6", "from": "d2", "to": "d3", "fs": "b", "ts": "t"}, {"id": "w7", "from": "d3", "to": "dv", "fs": "r", "ts": "t"}, {"id": "w8", "from": "dv", "to": "d4", "fs": "r", "ts": "l", "label": "Yes"}, {"id": "w9", "from": "dv", "to": "dx", "fs": "b", "ts": "t", "label": "No", "exc": true}, {"id": "w10", "from": "dx", "to": "dr", "fs": "l", "ts": "b", "label": "Investigate", "exc": true}, {"id": "w11", "from": "d4", "to": "d5", "fs": "r", "ts": "l"}, {"id": "w12", "from": "d5", "to": "d6", "fs": "t", "ts": "b", "label": "Sync back"}, {"id": "w13", "from": "d6", "to": "e", "fs": "r", "ts": "l"}], "notes": [{"h": "Counting happens in LOC.", "t": "Stores run physical and cycle counts in LOC SMS, where staff already work."}, {"h": "Posting happens in SAP.", "t": "Only approved variances go to SAP B1, which validates and posts them as inventory adjustments."}, {"h": "The loop closes through SAP.", "t": "LOC gets the new balance from SAP after posting, so SAP B1 stays the single authority."}]}]}

<script id="app-js">
(function(){
const NS="http://www.w3.org/2000/svg",LABEL=128,COLW=172,NW=148,DKEY="kkflows-draft";
const LANE_C={sap:["--sap","--sap-t"],loc:["--loc","--loc-t"],pos:["--pos","--pos-t"],b1:["--b1","--b1-t"]};

const store={get(s,k){try{return s.getItem(k)}catch(e){return null}},set(s,k,v){try{s.setItem(k,v)}catch(e){}},del(s,k){try{s.removeItem(k)}catch(e){}}};
const SS=(()=>{try{return sessionStorage}catch(e){return null}})(),LS=(()=>{try{return localStorage}catch(e){return null}})();
let pendingDraft=null;
if(SS){const d=store.get(SS,DKEY);if(d){if(d===JSON.stringify(JSON.parse(ORIG)))store.del(SS,DKEY);else pendingDraft=d}}
if(LS&&store.get(LS,"kkfit")==="1")fit=true;

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const flowBy=id=>state.flows.find(f=>f.id===id);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function wrap(t,max){if(!t)return[];const out=[];let cur="";for(const w of String(t).split(" ")){if((cur+" "+w).trim().length>max&&cur){out.push(cur);cur=w}else cur=(cur+" "+w).trim()}if(cur)out.push(cur);return out}
function svgPt(svg,e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}
const shortName=n=>(n.title||"Untitled").replace(/\n/g," ");

function draw(svg,f){
  svg.innerHTML="";
  let y=0;const lanes=f.lanes.map((l,i)=>{const tall=f.nodes.some(n=>n.lane===l.key&&n.row);const h=tall?262:150;const o={...l,top:y,h,i,tall};y+=h;return o});
  const cols=Math.max(4,...f.nodes.map(n=>n.col+1))+(editing?1:0);
  const W=LABEL+cols*COLW+16,H=y;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("width",W);svg.setAttribute("height",H);
  const defs=el("defs",{},svg);
  [["ar","var(--line)"],["arx","var(--exc)"]].forEach(([id,c])=>{const m=el("marker",{id:f.id+id,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"8",markerHeight:"8",orient:"auto-start-reverse"},defs);el("path",{d:"M0,0 L10,5 L0,10 z",style:`fill:${c}`},m)});
  lanes.forEach(l=>{
    el("rect",{x:0,y:l.top,width:W,height:l.h,style:`fill:var(${l.i%2?"--lane-b":"--lane-a"})`},svg);
    el("rect",{x:0,y:l.top,width:6,height:l.h,style:`fill:var(${(LANE_C[l.key]||LANE_C.loc)[0]})`},svg);
    if(l.i)el("line",{x1:0,x2:W,y1:l.top,y2:l.top,style:"stroke:var(--rule)"},svg);
    el("text",{x:18,y:l.top+l.h/2-4,class:"lane-name"},svg).textContent=l.name;
    el("text",{x:18,y:l.top+l.h/2+13,class:"lane-role"},svg).textContent=l.role;
  });
  el("line",{x1:LABEL-6,x2:LABEL-6,y1:0,y2:H,style:"stroke:var(--rule)"},svg);
  const laneBy=Object.fromEntries(lanes.map(l=>[l.key,l]));
  const N={};
  const edgeLayer=el("g",{},svg),nodeLayer=el("g",{},svg);
  f.nodes.forEach(n=>{
    const l=laneBy[n.lane]||lanes[0],cx=LABEL+n.col*COLW+COLW/2,cy=l.top+(n.row?190:74);
    const tl=String(n.title||"").split("\n").flatMap(s=>wrap(s,n.shape==="dia"?14:21));
    const sl=n.shape==="dia"?[]:wrap(n.sub,25);
    let w=NW,h=Math.max(56,18+tl.length*15+sl.length*13.5+(n.tag?13:0));
    if(n.shape==="oval"){w=134;h=46}
    if(n.shape==="dia"){w=112;h=84}
    const [stroke,fill]=n.exc?["--exc","--exc-t"]:(LANE_C[l.key]||LANE_C.loc);
    const g=el("g",{class:"node","data-id":n.id},nodeLayer);
    const st=`fill:var(${fill});stroke:var(${stroke});stroke-width:1.6${n.pending?";stroke-dasharray:6 4":""}`;
    if(n.shape==="dia")el("polygon",{points:`${cx},${cy-h/2} ${cx+w/2},${cy} ${cx},${cy+h/2} ${cx-w/2},${cy}`,style:st},g);
    else el("rect",{x:cx-w/2,y:cy-h/2,width:w,height:h,rx:n.shape==="oval"?h/2:7,style:st},g);
    let ty=cy-h/2+(n.shape==="dia"||n.shape==="oval"?h/2-(tl.length-1)*7.5+4:17);
    tl.forEach(s=>{el("text",{x:cx,y:ty,class:"n-t","text-anchor":"middle"},g).textContent=s;ty+=15});
    ty+=1;sl.forEach(s=>{el("text",{x:cx,y:ty,class:"n-s","text-anchor":"middle"},g).textContent=s;ty+=13.5});
    if(n.tag)el("text",{x:cx,y:ty+1,class:"tag","text-anchor":"middle"},g).textContent=n.tag;
    if(editing&&sel&&sel.f===f.id&&sel.n===n.id)el("rect",{x:cx-w/2-6,y:cy-h/2-6,width:w+12,height:h+12,rx:9,class:"selbox"},g);
    N[n.id]={cx,cy,w,h,lane:l.key,row:n.row||0,col:n.col};
    if(editing)attachDrag(svg,g,f,n,N,lanes);
  });
  const port=(n,s)=>s==="r"?[n.cx+n.w/2,n.cy]:s==="l"?[n.cx-n.w/2,n.cy]:s==="t"?[n.cx,n.cy-n.h/2]:[n.cx,n.cy+n.h/2];
  const auto=(a,b)=>{if(a.lane===b.lane&&a.row===b.row)return a.col<=b.col?["r","l"]:["l","r"];if(a.col===b.col)return a.cy<b.cy?["b","t"]:["t","b"];return[a.col<b.col?"r":"l",a.cy<b.cy?"t":"b"]};
  f.edges.forEach(e=>{
    const A=N[e.from],B=N[e.to];if(!A||!B||A===B)return;
    const au=auto(A,B),as=e.fs||au[0],bs=e.ts||au[1];
    const p1=port(A,as),p2=port(B,bs);let pts=[p1];
    if(e.via)pts.push(...e.via.map(v=>[v[0]==="a"?p1[0]:v[0]==="b"?p2[0]:v[0],v[1]==="a"?p1[1]:v[1]==="b"?p2[1]:v[1]]));
    else if((as==="r"||as==="l")&&(bs==="l"||bs==="r")){if(p1[1]!==p2[1]){const mx=(p1[0]+p2[0])/2;pts.push([mx,p1[1]],[mx,p2[1]])}}
    else if((as==="t"||as==="b")&&(bs==="t"||bs==="b")){if(p1[0]!==p2[0]){const my=(p1[1]+p2[1])/2;pts.push([p1[0],my],[p2[0],my])}}
    else if(as==="r"||as==="l")pts.push([p2[0],p1[1]]);
    else pts.push([p1[0],p2[1]]);
    pts.push(p2);
    el("polyline",{points:pts.map(p=>p.join(",")).join(" "),class:"edge"+(e.pending?" p":"")+(e.exc?" x":""),"marker-end":`url(#${f.id}${e.exc?"arx":"ar"})`},edgeLayer);
    if(e.label){
      const [q1,q2]=[pts[0],pts[1]],dx=Math.sign(q2[0]-q1[0]),dy=Math.sign(q2[1]-q1[1]);

  });

  else svg.onpointerdown=null;
}

function attachDrag(svg,g,f,n,N,lanes){
  g.addEventListener("pointerdown",e=>{
    e.preventDefault();e.stopPropagation();
    const s=svgPt(svg,e);let moved=false;
    try{g.setPointerCapture(e.pointerId)}catch(_){}
    const mv=ev=>{const q=svgPt(svg,ev),dx=q.x-s.x,dy=q.y-s.y;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;if(moved)g.setAttribute("transform",`translate(${dx},${dy})`)};
    const up=ev=>{
      g.removeEventListener("pointermove",mv);g.removeEventListener("pointerup",up);g.removeEventListener("pointercancel",up);
      if(!moved){sel={f:f.id,n:n.id};renderMain();renderPanel();return}
      const q=svgPt(svg,ev),gx=N[n.id],nx=gx.cx+(q.x-s.x),ny=gx.cy+(q.y-s.y);
      const col=Math.max(0,Math.round((nx-LABEL-COLW/2)/COLW));
      const lane=lanes.find(l=>ny>=l.top&&ny<l.top+l.h)||(ny<0?lanes[0]:lanes[lanes.length-1]);
      const row=(ny-lane.top)>(lane.tall?132:118)?1:0;
      moveNode(f,n,lane.key,col,row);sel={f:f.id,n:n.id};change(true);
    };
    g.addEventListener("pointermove",mv);g.addEventListener("pointerup",up);g.addEventListener("pointercancel",up);
  });
}
function resetRoutes(f,ids){f.edges.forEach(e=>{if(ids.includes(e.from)||ids.includes(e.to)){delete e.via;delete e.fs;delete e.ts}})}
function moveNode(f,n,lane,col,row){
  if(n.lane===lane&&n.col===col&&(n.row||0)===row)return;
  const occ=f.nodes.find(o=>o!==n&&o.lane===lane&&o.col===col&&(o.row||0)===row);
  if(occ){occ.lane=n.lane;occ.col=n.col;occ.row=n.row||0}
  n.lane=lane;n.col=col;n.row=row;
  resetRoutes(f,occ?[n.id,occ.id]:[n.id]);
}

function renderMain(){
  const p=state.page;
  app.innerHTML=`<p class="eyebrow">${esc(p.eyebrow)}</p><h1>${esc(p.title)}</h1><p class="lede">${esc(p.lede)}</p>

function opt(v,label,cur){return `<option value="${esc(v)}" ${String(v)===String(cur)?"selected":""}>${esc(label)}</option>`}

function renderPanel(){

    <div class="grp"><h4>Arrows out of this step</h4>
    ${outs.map(e=>`<div class="card">
      <div class="pf"><label for="e-to-${e.id}">Goes to</label><select id="e-to-${e.id}" data-ek="to" data-eid="${e.id}">${others.map(o=>opt(o.id,shortName(o),e.to)).join("")}</select></div>
      <div class="pf"><label for="e-lb-${e.id}">Label</label><input type="text" id="e-lb-${e.id}" data-ek="label" data-eid="${e.id}" value="${esc(e.label)}" placeholder="e.g. Yes"></div>
      <div class="row2"><div class="pf"><label for="e-fs-${e.id}">Leaves from</label><select id="e-fs-${e.id}" data-ek="fs" data-eid="${e.id}">${SIDES.map(s=>opt(s[0],s[1],e.fs||"")).join("")}</select></div>
      <div class="pf"><label for="e-ts-${e.id}">Enters at</label><select id="e-ts-${e.id}" data-ek="ts" data-eid="${e.id}">${SIDES.map(s=>opt(s[0],s[1],e.ts||"")).join("")}</select></div></div>
      <label class="chk"><input type="checkbox" id="e-p-${e.id}" data-ek="pending" data-eid="${e.id}" ${e.pending?"checked":""}> Dashed</label>
      <label class="chk"><input type="checkbox" id="e-x-${e.id}" data-ek="exc" data-eid="${e.id}" ${e.exc?"checked":""}> Exception (red)</label>
      <button class="sm danger" data-act="deledge" data-eid="${e.id}">Remove arrow</button></div>`).join("")||`<p class="inlist">No arrows yet.</p>`}
    ${others.length?`<button class="sm" data-act="addedge">+ Add arrow</button>`:""}
    <p class="inlist" style="margin-top:10px">Arrows into this step: ${ins.length?ins.map(e=>esc(shortName(f.nodes.find(x=>x.id===e.from)||{}))).join(", "):"none"}</p></div>
    <div class="grp"><button class="danger" data-act="delnode">Delete this step</button></div>`;
  }else{
    const p=state.page;
    body=`<p class="hint">Click a step on the chart to edit it, or drag it to move it. Use “+ Add step” beside each flow title to add one.</p>
    <div class="grp"><h4>Page text</h4>
    <div class="pf"><label for="p-eyebrow">Header line</label><input type="text" id="p-eyebrow" data-pk="eyebrow" value="${esc(p.eyebrow)}"></div>
    <div class="pf"><label for="p-title">Title</label><input type="text" id="p-title" data-pk="title" value="${esc(p.title)}"></div>
    <div class="pf"><label for="p-lede">Introduction</label><textarea id="p-lede" rows="3" data-pk="lede">${esc(p.lede)}</textarea></div>
    <div class="pf"><label for="p-footer">Footer</label><textarea id="p-footer" rows="2" data-pk="footer">${esc(p.footer)}</textarea></div></div>
    ${state.flows.map(f=>`<div class="grp"><h4>${esc(f.name.split("·")[0].trim())}</h4>
      <div class="pf"><label for="f-name-${f.id}">Heading</label><input type="text" id="f-name-${f.id}" data-fk="name" data-fid="${f.id}" value="${esc(f.name)}"></div>
      <div class="pf"><label for="f-route-${f.id}">Route line</label><input type="text" id="f-route-${f.id}" data-fk="route" data-fid="${f.id}" value="${esc(f.route)}"></div>
      <p class="lbl">Lanes</p>
      ${f.lanes.map((l,i)=>`<div class="row2"><div class="pf"><input type="text" id="l-n-${f.id}-${i}" aria-label="Lane name" data-lk="name" data-fid="${f.id}" data-i="${i}" value="${esc(l.name)}"></div><div class="pf"><input type="text" id="l-r-${f.id}-${i}" aria-label="Lane role" data-lk="role" data-fid="${f.id}" data-i="${i}" value="${esc(l.role)}"></div></div>`).join("")}
      <p class="lbl">Talking points</p>
      ${f.notes.map((nt,i)=>`<div class="card"><div class="pf"><input type="text" id="nt-h-${f.id}-${i}" aria-label="Point heading" data-tk="h" data-fid="${f.id}" data-i="${i}" value="${esc(nt.h)}"></div><div class="pf"><textarea id="nt-t-${f.id}-${i}" rows="2" aria-label="Point text" data-tk="t" data-fid="${f.id}" data-i="${i}">${esc(nt.t)}</textarea></div><button class="sm danger" data-act="delnote" data-fid="${f.id}" data-i="${i}">Remove point</button></div>`).join("")}
      <button class="sm" data-act="addnote" data-fid="${f.id}">+ Add talking point</button></div>`).join("")}`;
  }
  panel.innerHTML=head+body;
}

function change(structural){dirty=true;renderMain();if(structural)renderPanel();else{const s=panel.querySelector(".status");if(s){s.textContent="Unsaved changes";s.classList.add("dirty")}panel.querySelectorAll('[data-act="save"],[data-act="discard"]').forEach(b=>b.disabled=saving)}}

function onField(t){
  const f=sel&&flowBy(sel.f),n=f&&f.nodes.find(x=>x.id===sel.n);
  if(t.dataset.nk&&n){
    const k=t.dataset.nk;
    if(k==="exc"||k==="pending"){n[k]=t.checked}
    else if(k==="col"){const v=parseInt(t.value,10);if(!(v>=1))return;moveNode(f,n,n.lane,v-1,n.row||0)}
    else if(k==="row"){moveNode(f,n,n.lane,n.col,+t.value)}
    else if(k==="lane"){moveNode(f,n,t.value,n.col,n.row||0)}
    else if(k==="shape"){if(t.value)n.shape=t.value;else delete n.shape}
    else n[k]=t.value;
    return change(false);
  }
  if(t.dataset.ek&&f){
    const e=f.edges.find(x=>x.id===t.dataset.eid);if(!e)return;const k=t.dataset.ek;
    if(k==="pending"||k==="exc")e[k]=t.checked;
    else if(k==="to"){e.to=t.value;delete e.via;delete e.fs;delete e.ts;change(false);return renderPanel()}
    else if(k==="fs"||k==="ts"){delete e.via;if(t.value)e[k]=t.value;else delete e[k]}
    else e[k]=t.value;
    return change(false);
  }
  if(t.dataset.pk){state.page[t.dataset.pk]=t.value;return change(false)}
  const fl=t.dataset.fid&&flowBy(t.dataset.fid);if(!fl)return;
  if(t.dataset.fk){fl[t.dataset.fk]=t.value;return change(false)}
  if(t.dataset.lk){fl.lanes[+t.dataset.i][t.dataset.lk]=t.value;return change(false)}
  if(t.dataset.tk){fl.notes[+t.dataset.i][t.dataset.tk]=t.value;return change(false)}
}
panel.addEventListener("input",e=>onField(e.target));
panel.addEventListener("change",e=>{if(e.target.type==="checkbox"||e.target.tagName==="SELECT")onField(e.target)});

function buildDoc(st){
  const css=document.getElementById("app-css").textContent,js=document.getElementById("app-js").textContent;
  const json=JSON.stringify(st).replace(/</g,"\\u003c");
  const reset=":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}";
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    '<title>'+esc(st.page.docTitle)+'</title>\n'+
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">\n'+
    '<style id="app-css">'+css+'</style>\n\n<div id="app"></div>\n<aside id="panel" hidden aria-label="Flowchart editor"></aside>\n\n'+
    '<script type="application/json" id="state">\n'+json+'\n<\/script>\n\n<script id="app-js">'+js+'<\/script></body></html>';
}

async function save(){
  if(saving||!dirty)return;
  if(!ART){msg="Saving isn't available in this view. Open the flowchart on claude.ai to save changes.";renderMain();return}
  const draft=JSON.stringify(state);if(SS)store.set(SS,DKEY,draft);
  saving=true;renderMain();renderPanel();
  try{await ART.publish(buildDoc(state));}
  catch(err){
    const c=err&&err.code;saving=false;
    if(c==="conflict")msg="Someone else saved a newer version first. The page is reloading to it, and you can restore your edits afterwards.";
    else{
      if(SS)store.del(SS,DKEY);
      if(RO_CODES.includes(c)){readOnly=true;editing=false;msg="You can view this flowchart, but you don't have permission to save changes."}
      else if(c==="rate_limited")msg="Saving too often. Wait a moment, then save again.";
      else if(c==="too_large")msg="The flowchart is too large to save. Remove some steps and try again.";
      else msg="Saving didn't work. Wait a moment and try again; your edits are still here.";
    }
    renderMain();renderPanel();
  }
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  const f=sel&&flowBy(sel.f),n=f&&f.nodes.find(x=>x.id===sel.n);
  if(a==="edit"){editing=!editing;if(!editing)sel=null;renderMain();renderPanel()}
  else if(a==="fit"||a==="actual"){fit=a==="fit";if(LS)store.set(LS,"kkfit",fit?"1":"0");renderMain()}
  else if(a==="save")save();
  else if(a==="discard"){state=JSON.parse(ORIG);dirty=false;sel=null;renderMain();renderPanel()}
  else if(a==="restore"){try{state=JSON.parse(pendingDraft)}catch(_){}pendingDraft=null;if(SS)store.del(SS,DKEY);dirty=true;editing=true;sel=null;msg="";renderMain();renderPanel()}
  else if(a==="dropdraft"){pendingDraft=null;if(SS)store.del(SS,DKEY);renderMain()}
  else if(a==="clearmsg"){msg="";renderMain()}
  else if(a==="addnode"){const fl=flowBy(b.dataset.fid);const col=Math.max(-1,...fl.nodes.map(x=>x.col))+1;const nn={id:uid("n"),lane:fl.lanes[0].key,col,row:0,title:"New step",sub:"",tag:""};fl.nodes.push(nn);sel={f:fl.id,n:nn.id};change(true)}
  else if(a==="addedge"&&n){const t=f.nodes.find(x=>x.id!==n.id);f.edges.push({id:uid("e"),from:n.id,to:t.id});change(true)}
  else if(a==="deledge"&&f){f.edges=f.edges.filter(x=>x.id!==b.dataset.eid);change(true)}
  else if(a==="delnode"&&n){f.nodes=f.nodes.filter(x=>x!==n);f.edges=f.edges.filter(x=>x.from!==n.id&&x.to!==n.id);sel=null;change(true)}
  else if(a==="addnote"){flowBy(b.dataset.fid).notes.push({h:"New point.",t:""});change(true)}
  else if(a==="delnote"){flowBy(b.dataset.fid).notes.splice(+b.dataset.i,1);change(true)}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&editing&&sel){sel=null;renderMain();renderPanel()}});

renderMain();renderPanel();
if(window.claude&&typeof window.claude.use==="function")window.claude.use("artifact").then(a=>{ART=a}).catch(()=>{});
})();
</script>
